  <!-- Structured data (Google, ChatGPT, Perplexity, Gemini understand the site) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "OasisSpace",
    "alternateName": "Oasis Space",
    "url": "https://oasis-space.vercel.app/",
    "description": "Online real estate marketplace to buy, sell and rent homes, apartments and villas in India.",
    "inLanguage": "en-IN",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://oasis-space.vercel.app/search?searchTerm={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "OasisSpace",
    "url": "https://oasis-space.vercel.app/",
    "logo": "https://oasis-space.vercel.app/logo.png",
    "founder": {
      "@type": "Person",
      "name": "Shivam Singh",
      "jobTitle": "Founder & Full-Stack Developer",
      "url": "https://github.com/shivamsingh7533"
    },
    "sameAs": [
      "https://github.com/shivamsingh7533",
      "https://oasis-space.vercel.app/"
    ],
    "knowsAbout": ["Real Estate", "Property Marketplace", "Buy Rent Sell Homes India", "AI Real Estate Search"]
  }
  </script>

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />

  <!-- ✅ DNS Prefetch & Preconnect for external domains (saves 100-200ms) -->
  <link rel="dns-prefetch" href="https://wsrv.nl" />
  <link rel="preconnect" href="https://wsrv.nl" crossorigin />
  <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com" />
  <link rel="dns-prefetch" href="https://cdn.pixabay.com" />

  <!-- Performance: Removed unused Google Fonts preconnect to eliminate Render Blocking 350ms false-positive -->

  <!-- LCP Preload: Hero Background Image (WebP Compressed) -->
  <link rel="preload" href="/home.webp" as="image" type="image/webp" fetchpriority="high" />

  <title>OasisSpace</title>
